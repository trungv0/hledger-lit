[project]
name = "hledger-lit"
version = "0.2.0"
description = "A streamlit+plotly app to plot hledger balance reports"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
dependencies = ["plotly", "streamlit"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["hledger_lit*"]

[tool.ruff]
line-length = 120
extend-exclude = ["main.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
